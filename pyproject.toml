[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transitabilidade-ml"
version = "0.1.0"
description = "Ferramentas de dados e ML para o projeto de transitabilidade urbana"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "Pillow>=10",
    "PyYAML>=6.0",
    "streamlit>=1.39",
    "streamlit-drawable-canvas==0.13.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.57",
]

[tool.setuptools.packages.find]
include = ["ml*", "tools*"]

