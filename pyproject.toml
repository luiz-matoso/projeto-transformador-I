[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transitabilidade-ml"
version = "0.1.0"
description = "Ferramentas de dados e ML para o projeto de transitabilidade urbana"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "Pillow>=10",
    "PyYAML>=6.0",
    "streamlit>=1.39",
    "streamlit-drawable-canvas==0.13.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.57",
]

[tool.setuptools.packages.find]
include = ["ml*", "tools*", "api*"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "PyJWT==2.15.1", "argon2-cffi==25.1.0"]
api-test = ["httpx>=0.27,<1"]
deploy = ["modal>=1.6.4,<2"]

