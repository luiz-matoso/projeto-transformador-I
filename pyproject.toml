[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transitabilidade-ml"
version = "0.1.0"
description = "Ferramentas de dados e ML para o projeto de transitabilidade urbana"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "torch>=2.2",
    "torchvision>=0.17",
]

[tool.setuptools.packages.find]
include = ["ml*"]

