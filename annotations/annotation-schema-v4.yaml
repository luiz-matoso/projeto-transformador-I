schema_version: 4
schema_name: transitability_features_v4
description: Características visuais ordinais, relação objeto-faixa e disponibilidade;
  sem medidas físicas inferidas.
spatial_annotation:
  name: circulation_path
  display_name: Faixa principal de circulação
  description: Corredor estrutural que deveria permanecer disponível para circulação,
    sem contornar obstáculos internos.
  status_field: circulation_path_status
  geometry_field: circulation_path
  image_width_field: image_width
  image_height_field: image_height
  status_options:
  - value: annotated
    definition: Existe uma faixa principal identificável e sua geometria foi desenhada.
  - value: absent
    definition: Há evidência de ausência de corredor estrutural no trecho selecionado;
      não usar apenas porque está bloqueado.
  - value: unknown
    definition: Perspectiva, enquadramento ou oclusão impedem determinar a faixa com
      segurança.
labels:
  passage_width:
    display_name: Largura livre de passagem
    type: single-label
    required: true
    model_output: true
    unknown_value: unknown
    not_applicable_values: []
    description: Menor largura livre aparente no trecho selecionado. Julgamento ordinal,
      sem centímetros ou garantia de compatibilidade física.
    options:
    - value: wide
      definition: Passagem visualmente ampla no ponto mais estreito avaliável.
    - value: adequate
      definition: Passagem intermediária, com espaço residual visível.
    - value: narrow
      definition: Passagem visualmente estreita; sem medida física presumida.
    - value: very_narrow
      definition: Passagem residual muito estreita.
    - value: blocked
      definition: Não há passagem residual utilizável visível no corredor.
    - value: unknown
      definition: Perspectiva, oclusão ou enquadramento impedem avaliar.
  obstruction:
    display_name: Grau de obstrução
    type: single-label
    required: true
    model_output: true
    unknown_value: unknown
    not_applicable_values: []
    description: Quanto objetos relevantes invadem a faixa útil de circulação visível.
    options:
    - value: none
      definition: Nada relevante invade a faixa útil de circulação.
    - value: partial
      definition: Existe obstrução dentro da faixa, mas sobra passagem lateral aparente.
    - value: full
      definition: A obstrução impede completamente a rota visível.
    - value: unknown
      definition: Não é possível determinar o grau de obstrução.
  obstacle_type:
    display_name: Tipos de obstáculo relevantes
    type: multilabel
    required: true
    model_output: true
    unknown_value: null
    not_applicable_values: []
    empty_means: Nenhum obstáculo relevante para a faixa de circulação.
    description: Tipos relevantes para interferência; presença externa é registrada
      nas instâncias, sem gerar obstrução automaticamente.
    options:
    - value: vehicle
      definition: Carro, caminhão, van ou ônibus. A relação com o corredor é anotada
        separadamente; presença externa não implica interferência.
    - value: bike_scooter
      definition: Bicicleta ou patinete ocupando ou invadindo a passagem.
    - value: pole
      definition: Poste ou elemento vertical fixo dentro da faixa útil.
    - value: sign
      definition: Placa ou suporte de sinalização dentro da faixa útil.
    - value: tree
      definition: Tronco ou parte de árvore interferindo na passagem.
    - value: vegetation
      definition: Vegetação invadindo ou reduzindo a passagem.
    - value: trash_container
      definition: Lixeira ou recipiente de resíduos interferindo na passagem.
    - value: construction
      definition: Obra barreira ou equipamento de obra interferindo na passagem.
    - value: stairs
      definition: Escada ou degraus que interrompem a rota analisada.
    - value: litter_debris
      definition: Lixo solto ou entulho relevante sobre a passagem.
    - value: utility
      definition: Equipamento ou instalação de utilidade interferindo na passagem.
    - value: street_furniture
      definition: Mobiliário urbano interferindo na passagem.
    - value: other
      definition: Outro objeto relevante não coberto pelas opções anteriores.
  surface_condition:
    display_name: Condição geral da superfície
    type: single-label
    required: true
    model_output: true
    unknown_value: unknown
    not_applicable_values: []
    description: Estado predominante do piso na faixa de circulação visível.
    options:
    - value: regular
      definition: Piso de aparência regular, sem dano relevante visível; não certifica
        firmeza ou aderência.
    - value: minor_problem
      definition: Irregularidade ou degradação localizada mas superfície predominantemente
        utilizável.
    - value: major_problem
      definition: Problema significativo ocupando área relevante ou comprometendo
        claramente a circulação.
    - value: unknown
      definition: Não é possível avaliar a superfície com confiança.
  surface_obstacle:
    display_name: Problemas específicos da superfície
    type: multilabel
    required: true
    model_output: true
    unknown_value: null
    not_applicable_values: []
    empty_means: Ausência de problema específico relevante na superfície.
    description: Sinais do estado do piso; material é separado da gravidade. Entulho
      é instância litter_debris, sem dupla contagem.
    options:
    - value: cracks
      definition: Rachaduras ou fissuras relevantes.
    - value: bumpy
      definition: Ondulações ou saliências distribuídas aparentes no piso; sem inferir
        altura ou esforço de rodagem.
    - value: uneven_slanted
      definition: Deformação/desalinhamento local do piso; não representa a inclinação
        longitudinal da rua.
    - value: height_difference
      definition: Ressalto ou diferença localizada de altura na superfície.
    - value: very_broken
      definition: Piso extensamente quebrado ou fragmentado.
    - value: grass
      definition: Grama ocupando a superfície de passagem.
    - value: sand_gravel
      definition: Areia cascalho ou material solto na passagem.
    - value: pooled_water
      definition: Água acumulada na faixa de circulação.
    - value: rail_track
      definition: Trilho cruzando ou acompanhando a passagem.
    - value: utility_panel
      definition: Tampa/painel embutido visível; sua presença não implica gravidade
        ou obstrução.
    - value: other
      definition: Outro problema de superfície não coberto pelas opções anteriores.
  level_change:
    display_name: Mudança de nível
    type: single-label
    required: true
    model_output: true
    unknown_value: unknown
    not_applicable_values: []
    description: Presença e intensidade visual de mudança vertical relevante ao longo
      da rota.
    options:
    - value: none
      definition: Nenhum desnível perceptível relevante.
    - value: minor
      definition: Pequeno ressalto ou diferença de nível visível.
    - value: step
      definition: Degrau meio-fio elevado ou mudança vertical claramente significativa.
    - value: unknown
      definition: Não é possível julgar a mudança de nível.
  ramp_condition:
    display_name: Condição da rampa ou rebaixamento
    type: single-label
    required: true
    model_output: false
    unknown_value: unknown
    not_applicable_values:
    - not_applicable
    description: Disponibilidade e condição de uma solução de rampa quando a cena
      exige transição de nível.
    options:
    - value: not_applicable
      definition: Não existe situação na cena que exija avaliação de rampa.
    - value: clear
      definition: Rampa ou rebaixamento aparentemente utilizável e livre.
    - value: problematic
      definition: Existe rampa mas há problema visual relevante.
    - value: blocked
      definition: Existe rampa porém está fisicamente obstruída.
    - value: missing_required
      definition: Existe transição de nível relevante e não há solução acessível aparente.
    - value: unknown
      definition: Não é possível avaliar a condição da rampa.
  curb_access:
    display_name: Acesso entre calçada e via
    type: single-label
    required: true
    model_output: false
    unknown_value: unknown
    not_applicable_values:
    - not_applicable
    description: Forma visível da transição entre calçada e via quando essa transição
      faz parte da rota.
    options:
    - value: not_applicable
      definition: Nenhuma transição calçada-via relevante aparece na rota analisada.
    - value: level
      definition: Transição praticamente nivelada.
    - value: ramp
      definition: Existe rebaixamento ou rampa.
    - value: raised_no_ramp
      definition: Existe meio-fio ou degrau sem rebaixamento adequado aparente.
    - value: blocked
      definition: A transição existe porém está obstruída.
    - value: unknown
      definition: Não é possível determinar a forma ou condição do acesso.
  detour:
    display_name: Possibilidade de desvio
    type: single-label
    required: true
    model_output: false
    unknown_value: unknown
    not_applicable_values:
    - not_needed
    description: Existência de alternativa visível para contornar uma barreira e retornar
      à rota.
    options:
    - value: not_needed
      definition: A rota principal não exige desvio.
    - value: available
      definition: A imagem mostra alternativa contínua para contornar a barreira e
        retornar à rota.
    - value: unavailable
      definition: A barreira exige desvio e não existe alternativa visível utilizável.
    - value: unknown
      definition: O enquadramento não permite concluir se existe alternativa.
  path_continuity:
    display_name: Continuidade da rota
    type: single-label
    required: true
    model_output: true
    unknown_value: unknown
    not_applicable_values: []
    description: Continuidade visual da faixa de circulação ao atravessar a cena.
    options:
    - value: continuous
      definition: Existe faixa visual contínua de circulação atravessando a cena.
    - value: restricted
      definition: A rota continua existindo mas sofre estreitamento desvio ou comprometimento
        parcial.
    - value: interrupted
      definition: Não existe continuidade aparente.
    - value: unknown
      definition: Não é possível determinar a continuidade pelo enquadramento.
  slope:
    display_name: Inclinação longitudinal aparente
    type: single-label
    required: true
    model_output: false
    unknown_value: unknown
    not_applicable_values: []
    description: Inclinação longitudinal visual do trecho sem estimar porcentagens.
    options:
    - value: flat_gentle
      definition: Nenhuma inclinação relevante aparente.
    - value: inclined
      definition: Inclinação perceptível sem aparência extrema.
    - value: steep
      definition: Inclinação claramente acentuada.
    - value: unknown
      definition: A perspectiva não permite julgamento confiável.
  annotation_confidence:
    display_name: Confiança da anotação
    type: single-label
    required: true
    model_output: false
    unknown_value: null
    not_applicable_values: []
    description: Metadado sobre a confiabilidade da avaliação humana e nunca target
      do modelo.
    options:
    - value: high
      definition: Evidência visual direta e clara.
    - value: medium
      definition: Existe dúvida causada por perspectiva distância oclusão ou fator
        equivalente.
    - value: low
      definition: Classificação pouco confiável e prioritária para revisão.
surface_material_values:
- unknown
- hard_surface
- brick_cobblestone
- loose_surface
- vegetated_surface
- mixed
- other
route_scope_values:
- sidewalk_segment
- crossing_transition
- unknown
obstacle_instances:
  bbox_format: '[x_min,y_min,x_max,y_max], normalized [0,1], positive area'
  relations:
  - outside
  - encroaching
  - on_path
  - unknown
  note: BBox localiza objeto; sobreposição 2D não prova interferência física. Delimitar
    relevantes e negativos confusores, não todos os objetos.
multilabel_availability:
  values:
  - assessed
  - unknown
  note: Lista vazia com assessed confirma ausência; unknown não é negativo.
workflow_states:
- pending_review
- pending_annotation
- finalized
unknown_reason_values:
- occlusion
- out_of_frame
- too_small
- poor_image
- ambiguous_context
provenance_fields:
- source_metadata
- captured_at
- annotator_id
- reviewed_at
- protocol_version
- legacy_annotation
- review_flags
csv_columns:
- filename
- passage_width
- obstruction
- obstacle_type
- surface_condition
- surface_obstacle
- level_change
- ramp_condition
- curb_access
- detour
- path_continuity
- slope
- annotation_confidence
- circulation_path_status
- circulation_path
- image_width
- image_height
- circulation_path_origin
- comment
- annotation_timestamp
- schema_version
- obstacle_instances
- instances_availability
- obstacle_type_availability
- surface_obstacle_availability
- surface_material
- route_scope
- feature_unknown_reasons
- workflow_status
- review_flags
- review_acknowledged
- annotator_id
- reviewed_at
- protocol_version
- captured_at
- source_metadata
- legacy_annotation
review_requirements:
  finalization:
  - annotator_id
  - review_acknowledged=true
  - reviewed_at
  note: Finalização não implica elegibilidade para treinamento. Legacy e proveniência
    são preservados.
